<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380"><rect width="1100" height="380" fill="#f9faf9"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#537080"/></marker></defs><g font-family="Arial, sans-serif"><text x="36" y="48" fill="#648077" font-size="18" font-weight="bold" text-anchor="start">CORNER-TO-OUTCOME MATCHING · EVENT TIME WINDOW</text><line x1="100" y1="196" x2="1023" y2="196" stroke="#597b88" stroke-width="4"/><circle cx="168" cy="196" r="11" fill="#ba7959"/><text x="168" y="136" fill="#203b46" font-size="20" font-weight="bold" text-anchor="middle">Corner</text><text x="168" y="162" fill="#536b76" font-size="16" font-weight="normal" text-anchor="middle">t = 0 s</text><circle cx="470" cy="196" r="11" fill="#ba7959"/><text x="470" y="136" fill="#203b46" font-size="20" font-weight="bold" text-anchor="middle">Team possession</text><text x="470" y="162" fill="#536b76" font-size="16" font-weight="normal" text-anchor="middle">same team / phase</text><circle cx="785" cy="196" r="11" fill="#ba7959"/><text x="785" y="136" fill="#203b46" font-size="20" font-weight="bold" text-anchor="middle">Shot?</text><text x="785" y="162" fill="#536b76" font-size="16" font-weight="normal" text-anchor="middle">0–10 s window</text><text x="100" y="282" fill="#536b76" font-size="17" font-weight="normal" text-anchor="start">A shot outside the matching possession or time window does not count as a corner outcome.</text></g></svg>
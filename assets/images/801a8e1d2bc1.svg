<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380"><rect width="1100" height="380" fill="#f9faf9"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#537080"/></marker></defs><g font-family="Arial, sans-serif"><text x="38" y="48" fill="#648077" font-size="18" font-weight="bold" text-anchor="start">SEQUENTIAL THERMOELASTICITY · INTENDED COUPLING</text><rect x="37" y="114" width="289" height="126" rx="12" fill="#e6efeb" stroke="#bfcdd1"/><text x="55" y="149" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Thermal FEM</text><text x="55" y="178" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">K_T T = Q · implemented</text><rect x="409" y="114" width="296" height="126" rx="12" fill="#efeae2" stroke="#bfcdd1"/><text x="427" y="149" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Expansion loads</text><text x="427" y="178" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">f_th = ∫ Bᵀ C αΔT dV</text><rect x="788" y="114" width="280" height="126" rx="12" fill="#e9edf0" stroke="#bfcdd1"/><text x="806" y="149" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Mechanical FEM</text><text x="806" y="178" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">K_u u = f + f_th</text><path d="M327 176 L404 176" fill="none" stroke="#537080" stroke-width="3"  marker-end="url(#a)"/><path d="M708 176 L784 176" fill="none" stroke="#537080" stroke-width="3"  marker-end="url(#a)"/><text x="40" y="311" fill="#805e4b" font-size="17" font-weight="normal" text-anchor="start">Heat conduction verified. Assembly of expansion loads and coupled displacement/stress validation remain in progress.</text></g></svg>
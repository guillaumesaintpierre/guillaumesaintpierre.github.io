<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380"><rect width="1100" height="380" fill="#f9faf9"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#537080"/></marker></defs><g font-family="Arial, sans-serif"><text x="50" y="48" fill="#648077" font-size="18" font-weight="bold" text-anchor="start">LUMITRACK · KINEMATIC CONCEPT (NOT MANUFACTURING CAD)</text><g stroke="#315968" stroke-width="9" stroke-linecap="round" fill="none"><path d="M330 294 L330 222 L460 167 L570 130"/><path d="M460 167 L460 198 L570 167" stroke="#93a5a1" stroke-width="4"/><path d="M570 130 L619 144 L638 164"/></g><ellipse cx="330" cy="296" rx="82" ry="16" fill="#dce6e3" stroke="#516c76"/><path d="M619 145 Q685 120 717 180 L643 185 Z" fill="#eef1e6" stroke="#315968" stroke-width="4"/><circle cx="330" cy="222" r="9" fill="#b36c4f"/><circle cx="570" cy="130" r="9" fill="#b36c4f"/><path d="M330 222 L258 170" fill="none" stroke="#537080" stroke-width="3"  marker-end="url(#a)"/><text x="100" y="154" fill="#203e4b" font-size="19" font-weight="bold" text-anchor="start">Base yaw</text><text x="100" y="180" fill="#152f39" font-size="16" font-weight="normal" text-anchor="start">approx. ±50° planned</text><path d="M573 130 L758 84" fill="none" stroke="#537080" stroke-width="3"  marker-end="url(#a)"/><text x="762" y="84" fill="#203e4b" font-size="19" font-weight="bold" text-anchor="start">Head pitch</text><text x="762" y="110" fill="#152f39" font-size="16" font-weight="normal" text-anchor="start">approx. ±60° planned</text><text x="770" y="220" fill="#203e4b" font-size="20" font-weight="normal" text-anchor="start">θy = atan2(y, x)</text><text x="770" y="252" fill="#203e4b" font-size="19" font-weight="normal" text-anchor="start">θp = atan2(zₕ − z, ρ − rₕ)</text><text x="50" y="344" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">Original spring-arm joints remain manually adjustable; only yaw and head pitch are proposed for actuation.</text></g></svg>
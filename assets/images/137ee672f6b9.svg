<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380"><rect width="1100" height="380" fill="#f9faf9"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#537080"/></marker></defs><g font-family="Arial, sans-serif"><text x="45" y="55" fill="#648077" font-size="18" font-weight="bold" text-anchor="start">INVERTED PENDULUM · MODEL-BASED CONTROL</text><g stroke="#28556a" stroke-width="6"><path d="M300 244 L300 85"/><path d="M250 255 L350 255"/></g><circle cx="300" cy="85" r="17" fill="#d9ac65" stroke="#28556a" stroke-width="3"/><circle cx="260" cy="280" r="34" fill="#e6eae8" stroke="#28556a" stroke-width="5"/><circle cx="345" cy="280" r="34" fill="#e6eae8" stroke="#28556a" stroke-width="5"/><path d="M206 315 L405 315" stroke="#87999c" stroke-width="3"/><text x="440" y="120" fill="#203e4b" font-size="20" font-weight="normal" text-anchor="start">State: [position, velocity, angle, angular rate]</text><text x="440" y="170" fill="#203e4b" font-size="19" font-weight="normal" text-anchor="start">Model → linearisation → controller → simulation</text><text x="440" y="223" fill="#203e4b" font-size="19" font-weight="normal" text-anchor="start">Comparison: PD / cascade / LQR</text><text x="440" y="282" fill="#7a6251" font-size="16" font-weight="normal" text-anchor="start">Simulation results ≠ physical prototype performance</text></g></svg>
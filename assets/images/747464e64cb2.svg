<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380"><rect width="1100" height="380" fill="#f9faf9"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#537080"/></marker></defs><g font-family="Arial, sans-serif"><text x="48" y="54" fill="#648077" font-size="18" font-weight="bold" text-anchor="start">SQUASH BALL LAUNCHER · CONCEPTUAL KINEMATIC CHAIN</text><rect x="30" y="122" width="186" height="120" rx="12" fill="#edf3f0" stroke="#bfcdd1"/><text x="48" y="157" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Hand crank</text><text x="48" y="186" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">Manual torque</text><path d="M216 181 L240 181" fill="none" stroke="#537080" stroke-width="3"  marker-end="url(#a)"/><rect x="245" y="122" width="186" height="120" rx="12" fill="#edf3f0" stroke="#bfcdd1"/><text x="263" y="157" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Gear train</text><text x="263" y="186" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">2 stages · 20:1</text><path d="M431 181 L455 181" fill="none" stroke="#537080" stroke-width="3"  marker-end="url(#a)"/><rect x="460" y="122" width="186" height="120" rx="12" fill="#f1e8db" stroke="#bfcdd1"/><text x="478" y="157" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Spring</text><text x="478" y="186" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">k = 5,980 N/m</text><path d="M646 181 L670 181" fill="none" stroke="#537080" stroke-width="3"  marker-end="url(#a)"/><rect x="675" y="122" width="186" height="120" rx="12" fill="#edf3f0" stroke="#bfcdd1"/><text x="693" y="157" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Launch bar</text><text x="693" y="186" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">Guided release</text><path d="M861 181 L885 181" fill="none" stroke="#537080" stroke-width="3"  marker-end="url(#a)"/><rect x="890" y="122" width="186" height="120" rx="12" fill="#edf3f0" stroke="#bfcdd1"/><text x="908" y="157" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Ball exit</text><text x="908" y="186" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">Nominal 90 km/h</text><text x="36" y="295" fill="#536975" font-size="17" font-weight="normal" text-anchor="start">A synchronized five-ball gravity-fed magazine supplies the launch path.</text><text x="36" y="323" fill="#88979d" font-size="14" font-weight="normal" text-anchor="start">Schematic based on team report; not a dimensional CAD drawing.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380"><rect width="1100" height="380" fill="#f9faf9"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#537080"/></marker></defs><g font-family="Arial, sans-serif"><text x="45" y="47" fill="#648077" font-size="18" font-weight="bold" text-anchor="start">SPRING ENERGY ACCOUNTING · NOMINAL DESIGN POINT</text><rect x="60" y="99" width="280" height="120" rx="12" fill="#e8f0ee" stroke="#bfcdd1"/><text x="78" y="134" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Manual input</text><text x="78" y="163" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">20 N × 0.125 m → 2.5 N·m</text><rect x="417" y="99" width="280" height="120" rx="12" fill="#f3efe6" stroke="#bfcdd1"/><text x="435" y="134" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Elastic storage</text><text x="435" y="163" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">½ × 5980 × 0.115² = 39.54 J</text><rect x="775" y="99" width="280" height="120" rx="12" fill="#e8f0ee" stroke="#bfcdd1"/><text x="793" y="134" fill="#173b45" font-size="19" font-weight="bold" text-anchor="start">Ball + support</text><text x="793" y="163" fill="#536975" font-size="15" font-weight="normal" text-anchor="start">Target: 40.31 J before losses</text><path d="M341 163 L414 163" fill="none" stroke="#537080" stroke-width="3"  marker-end="url(#a)"/><path d="M698 163 L773 163" fill="none" stroke="#537080" stroke-width="3"  marker-end="url(#a)"/><text x="66" y="283" fill="#8f5a40" font-size="17" font-weight="bold" text-anchor="start">DESIGN CHECK</text><text x="66" y="315" fill="#4f6872" font-size="18" font-weight="normal" text-anchor="start">The reported nominal energy budget needs reconciliation and experimental validation.</text></g></svg>